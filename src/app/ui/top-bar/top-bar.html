<header class="top-bar" role="banner">
  <span class="wordmark" aria-label="Kaliwat">Kaliwat</span>

  <!-- Phones: the field has no room in the bar, so a button opens it over the whole bar. -->
  <button #searchToggle class="search-toggle" type="button" aria-label="Search people"
    [attr.aria-expanded]="search.open()" (click)="openSearch()">
    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" />
    </svg>
  </button>

  <div class="search-slot" [class.open]="search.open()">
    <svg class="search-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" />
    </svg>
    <input #q class="search-field" type="search" placeholder="Search people" aria-label="Search people"
      [value]="search.query()" (input)="search.query.set(q.value)" (keydown.escape)="search.open() && closeSearch()" />
    <button class="search-close" type="button" aria-label="Close search" (click)="closeSearch()">✕</button>
  </div>

  <nav class="view-tabs" role="tablist" aria-label="View">
    <button role="tab" class="tab"
      routerLink="/" [routerLinkActiveOptions]="{exact:true}" routerLinkActive="active"
      #listTab="routerLinkActive" [attr.aria-selected]="listTab.isActive">List</button>
    <button role="tab" class="tab"
      routerLink="/tree" routerLinkActive="active"
      #treeTab="routerLinkActive" [attr.aria-selected]="treeTab.isActive">Tree</button>
  </nav>

  @if (!store.isEmpty()) {
    <button class="export-btn extra" type="button" (click)="compare.open()" title="See how two people are related" aria-label="Compare">
      <span class="btn-text">Compare</span><span class="btn-icon" aria-hidden="true">⇄</span>
    </button>
    <!-- Below 360px Compare and Merge do not fit in the bar: they move into this menu. -->
    <button #moreBtn class="export-btn more-btn" type="button" aria-label="More actions" aria-haspopup="menu"
      [attr.aria-expanded]="moreOpen()" (click)="toggleMore()">
      <span class="btn-icon" aria-hidden="true">⋯</span>
    </button>
    @if (moreOpen()) {
      <div class="menu-backdrop" (click)="closeMore()" aria-hidden="true"></div>
      <div class="more-menu" role="menu" aria-label="More actions">
        <button #firstMoreItem class="more-item" role="menuitem" type="button" (click)="closeMore(); compare.open()">Compare</button>
        <button class="more-item" role="menuitem" type="button" (click)="closeMore(); mergeInput.click()">Merge…</button>
      </div>
    }
    <button class="export-btn" type="button" (click)="exportMenu.toggle()" title="Download the family file or the chart (PDF, SVG, JPG)"
      aria-label="Export" [attr.aria-expanded]="exportMenu.isOpen()">
      <span class="btn-text">Export</span><span class="btn-icon" aria-hidden="true">⤓</span>
    </button>
    <button class="export-btn extra" type="button" (click)="mergeInput.click()" title="Add people and photos from another .ged or .gdz file"
      aria-label="Merge">
      <span class="btn-text">Merge</span><span class="btn-icon" aria-hidden="true">⊕</span>
    </button>
    <input #mergeInput type="file" accept=".ged,.gdz" hidden (change)="onMerge($event, merge)" aria-label="Merge a GEDCOM file into this tree" />
  }
  <!-- With a tree open, phones show Import as an icon too, so the Merge button fits. -->
  <button class="import-btn" [class.compact]="!store.isEmpty()" type="button" (click)="importInput.click()" aria-label="Import"
    title="Open a .ged or .gdz file as a new tree">
    <span class="btn-text">Import</span>@if (!store.isEmpty()) {<span class="btn-icon" aria-hidden="true">⤒</span>}
  </button>
  <input #importInput type="file" accept=".ged,.gdz" hidden (change)="onImport($event)" aria-label="Import a GEDCOM file" />
</header>
<app-compare #compare />
<app-merge #merge />
<app-export-menu #exportMenu />
